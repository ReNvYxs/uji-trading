name: bt95
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bt95.yml'
      - 'alat/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bt95
  cancel-in-progress: true
env:
  MODUL_REPO: EnVyxS/lux-modul-trading
  MODUL_REF: 8401b2327736a4cc5c588d211eb6911dde0842da
  DATASET_REPO: EnVyxS/uji-trading
  ASET_ID: '502033995'
  ASET_SHA256: 79f906caaf9933d518c319821b77317e57ef15e00a30f849220024b8c6c1bff5
  GIT_TERMINAL_PROMPT: '0'
  AB95_PATH: klon_modul/scripts/ab95.py
jobs:
  penuh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: siapkan bahan uji
        run: bash alat/siapkan.sh
      - name: bedah runner
        continue-on-error: true
        run: bash alat/bedah_runner.sh
      - name: rekam siapkan
        if: always()
        run: bash alat/rekam.sh "siapkan + bedah runner"

      - name: dependensi modul
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r klon_modul/requirements.txt
          python -c "import numpy,pandas,pyarrow,yaml,pytest;print('dep OK')" | tee hasil/bt95/log_dependensi.txt

      - name: inventaris dataset 95 pair
        continue-on-error: true
        env:
          LUX_MAKS_SIMBOL: '0'
          LUX_BATAS_DETIK: '1800'
          LUX_KELUARAN: hasil/bt95/inventaris_dataset.json
          AB95_JEJAK_KONVERSI: hasil/bt95/konversi_inventaris.json
        run: |
          set +e
          python3 alat/jalankan_ab95.py inventaris 2>&1 | tee hasil/bt95/log_inventaris.txt
          echo "rc=${PIPESTATUS[0]}" | tee -a hasil/bt95/log_inventaris.txt
      - name: reduksi inventaris
        continue-on-error: true
        run: |
          set +e
          python3 alat/ringkas_inventaris.py 2>&1 | tee hasil/bt95/log_ringkas_inventaris.txt
          echo "rc=${PIPESTATUS[0]}" | tee -a hasil/bt95/log_ringkas_inventaris.txt
      - name: rekam inventaris
        if: always()
        run: bash alat/rekam.sh "inventaris dataset"

      - name: integritas sinyal single_15m
        continue-on-error: true
        env:
          LUX_KONFIG: single_15m
          LUX_MAKS_SIMBOL: '6'
          LUX_MAKS_BAR: '2500'
          LUX_SAMPEL: '30'
          LUX_BATAS_DETIK: '900'
          LUX_KELUARAN: hasil/bt95/pilot_integritas_single_15m.json
          AB95_JEJAK_KONVERSI: hasil/bt95/konversi_integritas_single_15m.json
        run: |
          set +e
          python3 alat/jalankan_ab95.py integritas 2>&1 | tee hasil/bt95/log_integritas_single_15m.txt
          echo "rc=${PIPESTATUS[0]}" | tee -a hasil/bt95/log_integritas_single_15m.txt
      - name: integritas sinyal single_4h
        continue-on-error: true
        env:
          LUX_KONFIG: single_4h
          LUX_MAKS_SIMBOL: '6'
          LUX_MAKS_BAR: '1200'
          LUX_SAMPEL: '30'
          LUX_BATAS_DETIK: '900'
          LUX_KELUARAN: hasil/bt95/pilot_integritas_single_4h.json
          AB95_JEJAK_KONVERSI: hasil/bt95/konversi_integritas_single_4h.json
        run: |
          set +e
          python3 alat/jalankan_ab95.py integritas 2>&1 | tee hasil/bt95/log_integritas_single_4h.txt
          echo "rc=${PIPESTATUS[0]}" | tee -a hasil/bt95/log_integritas_single_4h.txt
      - name: rekam integritas
        if: always()
        run: bash alat/rekam.sh "integritas sinyal 15m + 4h"

      - name: analisa 95 pair single_4h varian asli
        continue-on-error: true
        env:
          LUX_KONFIG: single_4h
          LUX_VARIAN: asli
          LUX_MAKS_SIMBOL: '0'
          LUX_MAKS_BAR: '1200'
          LUX_BATAS_DETIK: '2400'
          LUX_PIPELINE_PASS: '1'
          LUX_PIPELINE_MAKS: '95'
          LUX_KELUARAN: hasil/bt95/analisa_single_4h_asli.json
        run: |
          set +e
          python3 alat/analisa95.py 2>&1 | tee hasil/bt95/log_analisa_single_4h_asli.txt
          echo "rc=${PIPESTATUS[0]}" | tee -a hasil/bt95/log_analisa_single_4h_asli.txt
      - name: rekam analisa 4h asli
        if: always()
        run: bash alat/rekam.sh "analisa 95 pair single_4h asli"

      - name: analisa 95 pair single_4h varian final_bar_per_hari
        continue-on-error: true
        env:
          LUX_KONFIG: single_4h
          LUX_VARIAN: final_bar_per_hari
          LUX_MAKS_SIMBOL: '0'
          LUX_MAKS_BAR: '1200'
          LUX_BATAS_DETIK: '2400'
          LUX_PIPELINE_PASS: '1'
          LUX_PIPELINE_MAKS: '95'
          LUX_KELUARAN: hasil/bt95/analisa_single_4h_final_bar_per_hari.json
        run: |
          set +e
          python3 alat/analisa95.py 2>&1 | tee hasil/bt95/log_analisa_single_4h_final.txt
          echo "rc=${PIPESTATUS[0]}" | tee -a hasil/bt95/log_analisa_single_4h_final.txt
      - name: rekam analisa 4h varian
        if: always()
        run: bash alat/rekam.sh "analisa 95 pair single_4h varian final"

      - name: analisa 95 pair single_15m varian asli
        continue-on-error: true
        env:
          LUX_KONFIG: single_15m
          LUX_VARIAN: asli
          LUX_MAKS_SIMBOL: '0'
          LUX_MAKS_BAR: '6000'
          LUX_BATAS_DETIK: '6000'
          LUX_PIPELINE_PASS: '0'
          LUX_KELUARAN: hasil/bt95/analisa_single_15m_asli.json
        run: |
          set +e
          python3 alat/analisa95.py 2>&1 | tee hasil/bt95/log_analisa_single_15m_asli.txt
          echo "rc=${PIPESTATUS[0]}" | tee -a hasil/bt95/log_analisa_single_15m_asli.txt
      - name: rekam analisa 15m asli
        if: always()
        run: bash alat/rekam.sh "analisa 95 pair single_15m asli"

      - name: indeks artefak
        if: always()
        continue-on-error: true
        run: python3 alat/ringkas_pilot.py 2>&1 | tee hasil/bt95/log_ringkasan.txt
      - name: rekam ringkasan
        if: always()
        run: bash alat/rekam.sh "indeks artefak"
